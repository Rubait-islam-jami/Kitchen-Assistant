

services:
  kitchen-assistant:
    build: .
    container_name: kitchen-assistant

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - .:/app

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana
      - .:/app

volumes:
  grafana-storage: